# RANI AI — Android APK build (GitHub Actions)
#
# NOTE FOR THE PERSON PUSHING THIS FILE:
# The GitHub connector CANNOT push .github/workflows/* files (403 — "Resource
# not accessible by integration"). This file is delivered in the repo tree and
# must be pushed via the browser (github.com web upload) or git from a
# machine with repo access. Do NOT try to push it with the connector.
#
# WHAT IT DOES:
#   - Builds a DEBUG APK on every push / pull request (always, no secrets needed).
#   - Builds a SIGNED RELEASE APK only when signing secrets are present.
#     Secrets (repo Settings → Secrets and variables → Actions — NAMES only,
#     never put values in this file):
#       ANDROID_KEYSTORE_BASE64 — base64 of your release keystore (.keystore/.jks)
#       KEYSTORE_PASSWORD       — keystore password
#       KEY_ALIAS               — key alias
#       KEY_PASSWORD            — key password
#   - No keystore is committed to the repo. Create one at release time:
#       keytool -genkeypair -v -keystore rani-release.keystore -alias rani \
#         -keyalg RSA -keysize 2048 -validity 10000
#     then base64 it and store it as ANDROID_KEYSTORE_BASE64. Keep the
#     original keystore file safe — lose it and you can never update the app
#     under the same package name again.
#
# No APK is built by the agent that wrote this file — CI builds it.
name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'rani-web/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'rani-web/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE (2026-11-25, run #1 failed here): do NOT use
      # android-actions/setup-android — it tries to install the obsolete
      # 'tools' SDK package and sdkmanager fails with exit code 1.
      # The ubuntu-latest runner already ships a working Android SDK
      # (ANDROID_HOME is set by the runner image), so no SDK setup step
      # is needed. This is the same setup that builds BADSHAH AI.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3
          ls "$ANDROID_HOME/cmdline-tools"

      # No gradlew wrapper script is committed in this repo, so use the
      # Gradle installation directly (Gradle 8.7 matches AGP 8.5.2).
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK (always)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rani-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Signed release: only when ALL signing secrets exist ----
      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set — skipping signed release APK (debug APK above is still built)."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.present == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > rani-release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.present == 'true'
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/rani-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload signed release APK
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rani-ai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
